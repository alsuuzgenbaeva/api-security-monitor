spring:
  application:
    name: api-security-monitor

  datasource:
    url: jdbc:postgresql://localhost:5432/api_security_db
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false

monitoring:
  request-logging:
    enabled: true
    excluded-paths:
      - /error
      - /favicon.ico
      - /login
      - /logout
      - /monitoring
      - /monitoring/
      - /monitoring/index.html
      - /api/monitoring/summary
      - /api/monitoring/requests
      - /api/monitoring/events
  security:
    admin-username: ${MONITOR_ADMIN_USERNAME:admin}
    admin-password: ${MONITOR_ADMIN_PASSWORD}
  anomaly-detection:
    excessive-requests:
      enabled: true
      threshold: 5
      window: 10s
      suppression-period: 30s
    brute-force:
      enabled: true
      threshold: 5
      window: 60s
      suppression-period: 60s
      max-tracked-clients: 1000
      max-attempts-per-client: 100
    endpoint-scanning:
      enabled: true
      distinct-path-threshold: 5
      minimum-unsuccessful-requests: 8
      window: 60s
      suppression-period: 60s
    abnormal-error-rate:
      enabled: true
      minimum-request-count: 10
      client-error-rate-threshold-percent: 60
      window: 60s
      suppression-period: 60s
    query-payload:
      enabled: true
      max-query-length: 8192
      max-parameter-length: 2048
      max-parameters: 50
      max-path-length: 2048
      max-body-cache-bytes: 16384
      max-json-depth: 64
      max-json-values: 50
      max-json-string-length: 2048
      suppression-period: 30s

server:
  address: 127.0.0.1
  port: 8080
